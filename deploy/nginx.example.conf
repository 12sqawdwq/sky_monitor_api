server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location = /wiki {
        root /var/www/sky-monitor-api;
        try_files /wiki/index.html =404;
    }

    location = /wiki/ {
        return 301 /wiki;
    }

    location = /wiki/api {
        root /var/www/sky-monitor-api;
        try_files /wiki/api/index.html =404;
    }

    location = /wiki/api/ {
        return 301 /wiki/api;
    }

    location = /wiki/health {
        root /var/www/sky-monitor-api;
        try_files /wiki/health/index.html =404;
    }

    location = /wiki/health/ {
        return 301 /wiki/health;
    }

    location = /wiki/cities.tsv {
        root /var/www/sky-monitor-api;
        default_type text/tab-separated-values;
        add_header Cache-Control "public, max-age=86400";
        try_files /wiki/cities.tsv =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
